<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini MCP Auto Helper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-wrap">
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="icon" class="logo" />
        <div class="brand-info">
          <div class="brand-title-row">
            <h1 data-i18n="popupTitle">Gemini MCP 助手</h1>
            <span class="badge-beta" id="popupBetaBadge" data-i18n="betaBadge">v2.2</span>
          </div>
          <p class="subtitle" data-i18n="popupSubtitle">自动允许 · 默认模型锁定 · 多语言防误触</p>
          <div class="beta-notice" data-i18n="popupBetaNotice">✅ 正式发布版 (v2.2)</div>
        </div>
      </div>
      <label class="switch" title="总开关" data-i18n-title="popupMasterTitle">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </header>

    <section class="appearance-bar">
      <div class="appearance-item">
        <span class="appearance-icon" aria-hidden="true">🌐</span>
        <select id="language" class="select-lang" aria-label="Language">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
      <button type="button" id="btnToggleTheme" class="btn secondary btn-sm theme-btn">🌙 深色模式</button>
    </section>

    <section class="stats-bar" id="statsBar">
      <div class="stat-item">
        <span class="stat-label" data-i18n="popupStatAllow">今日允许</span>
        <strong id="statAllow">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label" data-i18n="popupStatContinue">今日继续</span>
        <strong id="statContinue">0 / ∞</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label" data-i18n="popupStatLive">当前状态</span>
        <strong id="statLive" class="badge-ok" data-i18n="livePending">待检测</strong>
      </div>
    </section>

    <section class="card chat-control-card" id="chatControlCard" style="display: none;">
      <div class="card-header-row">
        <div class="chat-header-left">
          <h2 data-i18n="secCurrentChat">当前对话独立控制</h2>
          <span class="chat-id-pill" id="chatLabel" data-i18n="chatLabelNew">新对话</span>
        </div>
        <div class="chat-header-right">
          <span class="chat-mode-tag" id="chatOverrideBadge" data-i18n="scopeFollowGlobal">跟随全局</span>
          <button type="button" id="btnResetChatOverride" class="btn ghost btn-xs" data-i18n="scopeResetBtn" data-i18n-title="scopeResetTip" style="display: none;">恢复全局</button>
        </div>
      </div>

      <div class="chat-toggle-grid">
        <label class="chat-toggle-item">
          <span data-i18n="hudRowMaster">插件状态</span>
          <input type="checkbox" id="chatEnabled" />
        </label>
        <label class="chat-toggle-item">
          <span data-i18n="hudRowAllow">自动始终允许</span>
          <input type="checkbox" id="chatAutoAllow" />
        </label>
        <label class="chat-toggle-item">
          <span data-i18n="hudRowContinue">自动点击继续</span>
          <input type="checkbox" id="chatAutoContinue" />
        </label>
        <label class="chat-toggle-item">
          <span data-i18n="hudRowBackground">后台切屏运行</span>
          <input type="checkbox" id="chatBackgroundMode" />
        </label>
        <label class="chat-toggle-item">
          <span data-i18n="hudRowNotif">桌面通知</span>
          <input type="checkbox" id="chatStallAlertEnabled" />
        </label>
        <label class="chat-toggle-item">
          <span data-i18n="hudRowStallRecover">超时自动续接</span>
          <input type="checkbox" id="chatStallAutoRecoverEnabled" />
        </label>
        <label class="chat-toggle-item">
          <span data-i18n="lblChatModelLock">锁定默认模型</span>
          <input type="checkbox" id="chatModelLockEnabled" />
        </label>
      </div>

      <div class="chat-action-row">
        <button type="button" id="btnChatEmergency" class="btn danger btn-sm" data-i18n="chatEmergencyBtn">仅停本对话</button>
      </div>
    </section>

    <div class="section-divider">
      <span data-i18n="secGlobalSettings">全局默认设置</span>
    </div>

    <section class="card">
      <h2 data-i18n="secCore">核心自动化</h2>
      <label class="toggle-row">
        <span data-i18n="lblAutoAllow">自动点击 MCP「始终允许」</span>
        <input type="checkbox" id="autoAllow" />
      </label>
      <label class="toggle-row sub">
        <span data-i18n="lblPreferAlways">优先选择「始终允许」（推荐）</span>
        <input type="checkbox" id="preferAlwaysAllow" />
      </label>
      <label class="toggle-row sub">
        <span data-i18n="lblFallbackSingle">无始终允许时回退点「允许一次」</span>
        <input type="checkbox" id="fallbackSingleAllow" />
      </label>
      <label class="toggle-row">
        <span data-i18n="lblAutoContinue">自动点击下方「继续」按钮</span>
        <input type="checkbox" id="autoContinue" />
      </label>
      <label class="toggle-row">
        <span data-i18n="lblBgMode">后台静默运行（切屏 / 最小化不中断）</span>
        <input type="checkbox" id="backgroundMode" />
      </label>
      <label class="toggle-row sub">
        <span data-i18n="lblPreventDiscard">防止 Chrome 休眠丢弃 Gemini 标签页</span>
        <input type="checkbox" id="preventTabDiscard" />
      </label>
      <label class="toggle-row">
        <span data-i18n="lblShowHud">在 Gemini 页面显示悬浮窗</span>
        <input type="checkbox" id="showHud" />
      </label>
    </section>

    <section class="card">
      <div class="card-header-row">
        <h2 data-i18n="secModelLock">默认模型锁定与自动切换</h2>
        <span class="model-live-pill" id="detectedModelBadge" data-i18n="modelUnknown">未检测到</span>
      </div>
      <label class="toggle-row">
        <span data-i18n="lblModelLockEnable">启用默认模型锁定（偏离自动切回，不可用时报错停止）</span>
        <input type="checkbox" id="modelLockEnabled" />
      </label>
      <label class="field">
        <span data-i18n="lblPreferredModel">默认工作模型（可点选预设或输入任意模型名）</span>
        <input type="text" id="preferredModel" maxlength="80" placeholder="例如：Pro、Thinking、Fast、2.5 Pro" data-i18n-placeholder="phPreferredModel" />
      </label>
      <div class="model-preset-chips" id="modelPresetChips"></div>
      <div class="inline-actions-2">
        <button type="button" id="btnUseCurrentModel" class="btn secondary btn-sm" data-i18n="btnUseCurrentModel">使用当前模型</button>
        <button type="button" id="btnDetectModels" class="btn secondary btn-sm" data-i18n="btnDetectModels">探测模型</button>
      </div>
      <div class="inline-field">
        <label class="field">
          <span data-i18n="lblModelMaxRetries">切回失败重试上限</span>
          <input type="number" id="maxModelSwitchRetries" min="1" max="10" step="1" />
        </label>
      </div>
      <label class="toggle-row">
        <span data-i18n="lblStopOnModelUnavailable">目标模型不可用或反复被切回时立即报错停止</span>
        <input type="checkbox" id="stopOnModelUnavailable" />
      </label>
      <button type="button" id="btnSwitchModelNow" class="btn secondary btn-sm" data-i18n="btnSwitchModelNow">🔄 立即检测并切回默认模型</button>
    </section>

    <section class="card">
      <h2 data-i18n="secBreaker">防刷额度熔断保护</h2>
      <div class="grid-2">
        <label class="field">
          <span data-i18n="lblMaxTask">单次任务继续上限</span>
          <input type="number" id="maxContinuesPerTask" min="1" max="100" step="1" />
        </label>
        <label class="field">
          <span data-i18n="lblDailyCap">每日继续总上限 (0=无上限)</span>
          <input type="number" id="dailyContinueLimit" min="0" max="10000" step="1" />
        </label>
        <label class="field">
          <span data-i18n="lblCooldown">继续冷却 (秒)</span>
          <input type="number" id="continueCooldownSec" min="1" max="120" step="0.5" />
        </label>
        <label class="field">
          <span data-i18n="lblSettle">输出停稳等待 (秒)</span>
          <input type="number" id="idleSettleSec" min="0.5" max="30" step="0.2" />
        </label>
      </div>
      <label class="toggle-row">
        <span data-i18n="lblStopCompletion">检测到「全部完成」等完工信号时跳过继续</span>
        <input type="checkbox" id="stopOnCompletionCues" />
      </label>
      <label class="toggle-row">
        <span data-i18n="lblStopStagnant">输出无新进展 / 重复时自动熔断</span>
        <input type="checkbox" id="stopOnStagnantOutput" />
      </label>
      <label class="toggle-row">
        <span data-i18n="lblStopQuota">检测到限流 / 额度 / 报错提示时立刻熔断</span>
        <input type="checkbox" id="stopOnQuotaOrError" />
      </label>
      <label class="toggle-row">
        <span data-i18n="lblHumanPacing">拟人防降速节流（随机延迟 + 逐字输入，降低限流风险）</span>
        <input type="checkbox" id="humanPacingEnabled" />
      </label>
    </section>

    <section class="card">
      <div class="card-header-row">
        <h2 data-i18n="secNotif">桌面通知提醒 (连接超时 / 卡死)</h2>
        <button type="button" id="btnToggleNotif" class="btn secondary btn-sm" data-i18n="btnNotifOn">桌面通知：开启</button>
      </div>
      <label class="toggle-row">
        <span data-i18n="lblStallEnable">连接 / 卡死超时发送电脑桌面通知</span>
        <input type="checkbox" id="stallAlertEnabled" />
      </label>
      <div class="inline-field">
        <label class="field">
          <span data-i18n="lblStallMinutes">连接超时提醒阈值 (分钟)</span>
          <input type="number" id="stallAlertMinutes" min="1" max="60" step="1" />
        </label>
        <button type="button" id="btnTestNotif" class="btn secondary btn-sm" data-i18n="btnTestNotif">测试通知</button>
      </div>
      <label class="toggle-row">
        <span data-i18n="lblStallRecoverEnable">超时卡住时自动终止对话并发送续接文字</span>
        <input type="checkbox" id="stallAutoRecoverEnabled" />
      </label>
      <div class="grid-2">
        <label class="field">
          <span data-i18n="lblStallRecoverMinutes">自动终止续接阈值 (分钟)</span>
          <input type="number" id="stallAutoRecoverMinutes" min="1" max="60" step="1" />
        </label>
        <label class="field">
          <span data-i18n="lblStallRecoverMax">单次任务最多自动恢复次数</span>
          <input type="number" id="maxStallRecoveriesPerTask" min="1" max="20" step="1" />
        </label>
      </div>
      <label class="field">
        <span data-i18n="lblStallRecoverPrompt">自定义续接发送文字</span>
        <input type="text" id="stallAutoRecoverPrompt" maxlength="200" placeholder="默认：继续，刚才mcp连接断开了" data-i18n-placeholder="phStallRecoverPrompt" />
      </label>
      <button type="button" id="btnForceRecover" class="btn secondary btn-sm" data-i18n="popupBtnForceRecover">⚡ 立即终止并发送续接文字</button>
    </section>

    <section class="card">
      <h2 data-i18n="secCustom">自定义匹配词（可选，换行或逗号分隔）</h2>
      <label class="field">
        <span data-i18n="lblCustomAllow">额外「始终允许」关键词</span>
        <textarea id="customAlwaysAllowKeywords" rows="2" placeholder="例如：始终同意、允许此工具" data-i18n-placeholder="phCustomAllow"></textarea>
      </label>
      <label class="field">
        <span data-i18n="lblCustomCont">额外「继续」关键词</span>
        <textarea id="customContinueKeywords" rows="2" placeholder="例如：继续下一步、接着写" data-i18n-placeholder="phCustomCont"></textarea>
      </label>
    </section>

    <section class="quick-actions-4">
      <button type="button" id="btnEmergency" class="btn danger" data-i18n="btnEmergency">紧急停止</button>
      <button type="button" id="btnEmergencyAll" class="btn danger-outline" data-i18n="btnEmergencyAll">停止全部对话</button>
      <button type="button" id="btnResetBreaker" class="btn secondary" data-i18n="btnResetBreaker">解除熔断</button>
      <button type="button" id="btnResetStats" class="btn secondary" data-i18n="btnResetStats">清零计数</button>
      <button type="button" id="btnResetHudPos" class="btn secondary btn-span-2" data-i18n="btnResetHudPos">复位悬浮窗</button>
    </section>

    <footer class="footer">
      <button type="button" id="btnDefaults" class="btn ghost" data-i18n="btnDefaults">恢复默认</button>
      <button type="button" id="btnSave" class="btn primary" data-i18n="btnSave">保存设置</button>
    </footer>
    <div id="toast" class="toast" aria-live="polite"></div>
  </div>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
